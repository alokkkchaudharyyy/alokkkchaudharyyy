<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="490" height="340" viewBox="0 0 490 340" fill="none" role="img">
<style>
  .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
  .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
  .in { animation: fadein .8s cubic-bezier(.2,.8,.2,1) both; }
  .rise { animation: rise .9s cubic-bezier(.2,.8,.2,1) both; }
  .blink { animation: blink 1s steps(1) infinite; }
  .pulse { animation: pulse 2.4s ease-in-out infinite; }
  .ping { animation: ping 2.2s cubic-bezier(0,0,.2,1) infinite; transform-box: fill-box; transform-origin: center; }
  .bob { animation: bob 6s ease-in-out infinite; }
  .twinkle { animation: twinkle 3s ease-in-out infinite; }
  .drift { animation: drift linear infinite; }
  @keyframes fadein { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @keyframes rise { from { opacity: 0; transform: translateY(26px); } to { opacity: 1; transform: none; } }
  @keyframes blink { 50% { opacity: 0; } }
  @keyframes pulse { 0%, 100% { opacity: .4; } 50% { opacity: 1; } }
  @keyframes ping { 0% { transform: scale(1); opacity: .7; } 80%, 100% { transform: scale(3); opacity: 0; } }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
  @keyframes twinkle { 0%, 100% { opacity: .15; } 50% { opacity: .9; } }
  @keyframes drift { from { transform: translateX(0); } to { transform: translateX(var(--d, -200px)); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<defs>
  <linearGradient id="cardbg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0c0f17"/><stop offset="1" stop-color="#05060a"/></linearGradient>
  <linearGradient id="cometg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#645396"/></linearGradient>
  <clipPath id="clip"><rect width="490" height="340" rx="16"/></clipPath>
  
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="5" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
  <radialGradient id="tglow" cx="392" cy="40" r="343" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#a78bfa" stop-opacity=".16"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></radialGradient>
</defs>
<rect x="0.5" y="0.5" width="489" height="339" rx="16" fill="url(#cardbg)" stroke="#1f2433"/><path d="M14 32 V14 H32" stroke="#a78bfa" stroke-opacity=".6" stroke-width="1.5"/><path d="M476 32 V14 H458" stroke="#a78bfa" stroke-opacity=".6" stroke-width="1.5"/><path d="M14 308 V326 H32" stroke="#a78bfa" stroke-opacity=".6" stroke-width="1.5"/><path d="M476 308 V326 H458" stroke="#a78bfa" stroke-opacity=".6" stroke-width="1.5"/><rect x="1" y="1" width="488" height="338" rx="16" pathLength="1000" fill="none" stroke="url(#cometg)" stroke-width="2" stroke-linecap="round" stroke-dasharray="140 860" filter="url(#glow)"><animate attributeName="stroke-dashoffset" from="1000" to="0" dur="7s" repeatCount="indefinite"/></rect>
<g clip-path="url(#clip)">

<rect width="490" height="340" fill="url(#tglow)"/>
<g transform="translate(56 12) scale(.88)">
<g class="in" style="animation-delay:.2s">
  <rect x="244" y="50" width="88" height="74" rx="10" fill="#120d22" stroke="#a78bfa" stroke-opacity=".6"/>
  <text x="288" y="80" text-anchor="middle" class="mono" font-size="12" fill="#eef2f8">agent</text>
  <text x="288" y="98" text-anchor="middle" class="mono" font-size="10" fill="#5f6b7d">plans</text>
  <rect x="392" y="50" width="72" height="74" rx="10" fill="#120d22" stroke="#a78bfa" stroke-opacity=".6"/>
  <text x="428" y="80" text-anchor="middle" class="mono" font-size="12" fill="#eef2f8">IDE</text>
  <text x="428" y="98" text-anchor="middle" class="mono" font-size="10" fill="#5f6b7d">builds</text>
  <path d="M332 72 H392" stroke="#a78bfa" stroke-opacity=".5" stroke-dasharray="3 4"/>
  <path d="M392 106 H332" stroke="#a3e635" stroke-opacity=".4" stroke-dasharray="3 4"/>
  <text x="362" y="62" text-anchor="middle" class="mono" font-size="9" fill="#a78bfa">task</text>
  <text x="362" y="122" text-anchor="middle" class="mono" font-size="9" fill="#a3e635">done</text>
  <rect x="-6" y="-4" width="12" height="8" rx="2" fill="#a78bfa" filter="url(#glow)"><animateMotion dur="2.4s" begin="-0.0s" repeatCount="indefinite" path="M332 72 H392"/></rect><rect x="-6" y="-4" width="12" height="8" rx="2" fill="#a78bfa" filter="url(#glow)"><animateMotion dur="2.4s" begin="-0.8s" repeatCount="indefinite" path="M332 72 H392"/></rect><rect x="-6" y="-4" width="12" height="8" rx="2" fill="#a78bfa" filter="url(#glow)"><animateMotion dur="2.4s" begin="-1.6s" repeatCount="indefinite" path="M332 72 H392"/></rect><circle r="4" fill="#a3e635"><animateMotion dur="2.4s" begin="-1.2s" repeatCount="indefinite" path="M392 106 H332"/></circle><circle r="4" fill="#a3e635"><animateMotion dur="2.4s" begin="-2.4s" repeatCount="indefinite" path="M392 106 H332"/></circle>
</g></g>
<g class="in">
  <rect x="34" y="34" width="175" height="24" rx="12" fill="#a78bfa" fill-opacity=".14" stroke="#a78bfa" stroke-opacity=".5"/>
  <circle cx="47" cy="46" r="3.5" fill="#a78bfa" class="pulse"/>
  <text x="57" y="50" class="mono" font-size="11" letter-spacing="1.5" fill="#a78bfa">VS CODE EXTENSION</text>
</g>
<g class="in" style="animation-delay:.15s">
  <text x="33" y="124" class="sans" font-size="30" font-weight="800" letter-spacing="-.5" fill="#eef2f8">Agent Bridge<tspan dx="10" dy="-2" font-size="18" font-weight="400" fill="#a78bfa">&#8599;</tspan></text>
  <text class="sans" font-size="14.5" fill="#9aa4b5"><tspan x="34" y="176">Lets Claude Code or any AI agent hand tasks to</tspan><tspan x="34" y="200">your IDE's AI chat, and know when they're done.</tspan></text>
  <rect x="34.0" y="282" width="94.0" height="24" rx="12" fill="#a78bfa" fill-opacity=".1" stroke="#a78bfa" stroke-opacity=".4"/><text x="45.0" y="298" class="mono" font-size="12" fill="#a78bfa">JavaScript</text><rect x="136.0" y="282" width="101.2" height="24" rx="12" fill="#a78bfa" fill-opacity=".1" stroke="#a78bfa" stroke-opacity=".4"/><text x="147.0" y="298" class="mono" font-size="12" fill="#a78bfa">VS Code API</text>
  <text x="456" y="299" text-anchor="end" class="mono" font-size="12.5" fill="#eef2f8">v0.4.0 · 1,772 installs</text>
</g>
</g>
</svg>
