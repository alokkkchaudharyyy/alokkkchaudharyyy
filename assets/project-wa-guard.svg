<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="510" height="300" viewBox="0 0 510 300" fill="none" role="img">
<svg x="10" y="10" width="490" height="280" viewBox="0 0 490 280">
<style>
  .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
  .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
  .in { animation: fadein .8s cubic-bezier(.2,.8,.2,1) both; }
  .rise { animation: rise .9s cubic-bezier(.2,.8,.2,1) both; }
  .blink { animation: blink 1s steps(1) infinite; }
  .pulse { animation: pulse 2.4s ease-in-out infinite; }
  .ping { animation: ping 2.2s cubic-bezier(0,0,.2,1) infinite; transform-box: fill-box; transform-origin: center; }
  .bob { animation: bob 6s ease-in-out infinite; }
  .twinkle { animation: twinkle 3s ease-in-out infinite; }
  .drift { animation: drift linear infinite; }
  @keyframes fadein { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @keyframes rise { from { opacity: 0; transform: translateY(26px); } to { opacity: 1; transform: none; } }
  @keyframes blink { 50% { opacity: 0; } }
  @keyframes pulse { 0%, 100% { opacity: .4; } 50% { opacity: 1; } }
  @keyframes ping { 0% { transform: scale(1); opacity: .7; } 80%, 100% { transform: scale(3); opacity: 0; } }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
  @keyframes twinkle { 0%, 100% { opacity: .15; } 50% { opacity: .9; } }
  @keyframes drift { from { transform: translateX(0); } to { transform: translateX(var(--d, -200px)); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }

  .wspam { animation: wspam 9s infinite; }
  .wflag { animation: wflag 9s infinite; }
  .wgone { animation: wgone 9s infinite; }
  .wkept { animation: wkept 9s infinite; }
  @keyframes wspam { 0%, 8% { opacity: 0; } 14%, 44% { opacity: 1; } 50%, 100% { opacity: 0; } }
  @keyframes wflag { 0%, 26% { opacity: 0; } 30%, 36% { opacity: 1; } 39% { opacity: .3; } 42%, 100% { opacity: 1; } }
  @keyframes wgone { 0%, 48% { opacity: 0; } 54%, 94% { opacity: 1; } 100% { opacity: 0; } }
  @keyframes wkept { 0%, 60% { opacity: 0; } 66%, 94% { opacity: 1; } 100% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .wgone, .wkept { opacity: 1; } }
</style>
<defs>
  <linearGradient id="cardbg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0c0f17"/><stop offset="1" stop-color="#05060a"/></linearGradient>
  <linearGradient id="cometg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#25d366"/><stop offset="1" stop-color="#167f3d"/></linearGradient>
  <clipPath id="clip"><rect width="490" height="280" rx="16"/></clipPath>
  
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="5" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
  <radialGradient id="tglow" cx="392" cy="40" r="343" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#25d366" stop-opacity=".16"/><stop offset="1" stop-color="#25d366" stop-opacity="0"/></radialGradient>
</defs>
<rect x="0.5" y="0.5" width="489" height="279" rx="16" fill="url(#cardbg)" stroke="#1f2433"/><path d="M14 32 V14 H32" stroke="#25d366" stroke-opacity=".6" stroke-width="1.5"/><path d="M476 32 V14 H458" stroke="#25d366" stroke-opacity=".6" stroke-width="1.5"/><path d="M14 248 V266 H32" stroke="#25d366" stroke-opacity=".6" stroke-width="1.5"/><path d="M476 248 V266 H458" stroke="#25d366" stroke-opacity=".6" stroke-width="1.5"/><rect x="1" y="1" width="488" height="278" rx="16" pathLength="1000" fill="none" stroke="url(#cometg)" stroke-width="2" stroke-linecap="round" stroke-dasharray="140 860" filter="url(#glow)"><animate attributeName="stroke-dashoffset" from="1000" to="0" dur="7s" repeatCount="indefinite"/></rect>
<g clip-path="url(#clip)">

<rect width="490" height="280" fill="url(#tglow)"/>

<g class="in" style="animation-delay:.2s">
  <rect x="290" y="22" width="176" height="108" rx="10" fill="#070d0b" stroke="#25d366" stroke-opacity=".4"/>
  <path d="M308 30 l6 2.5 v4.5 c0 4 -2.6 6.5 -6 8 c-3.4 -1.5 -6 -4 -6 -8 v-4.5 Z" stroke="#25d366" stroke-width="1.4" stroke-linejoin="round"/>
  <text x="322" y="41" class="sans" font-size="11" font-weight="700" fill="#eef2f8">IPUNEX · Nexera</text>
  <circle cx="452" cy="37" r="3" fill="#25d366" class="pulse"/>
  <line x1="290" x2="466" y1="52" y2="52" stroke="#25d366" stroke-opacity=".2"/>
  <g class="wspam" opacity="0">
    <rect x="299" y="60" width="158" height="30" rx="8" fill="#111a22"/><text x="308" y="72" class="mono" font-size="8" fill="#5f6b7d">+91 98xxx xxx21</text><text x="308" y="84" class="sans" font-size="10" fill="#eef2f8">Join!! <tspan fill="#38bdf8" text-decoration="underline">chat.whatsapp.com/Kx7</tspan></text>
    <rect x="299" y="60" width="158" height="30" rx="8" stroke="#fb7185" stroke-width="1.3" class="wflag" opacity="0"/>
  </g>
  <g class="wgone" opacity="0">
    <rect x="299" y="60" width="132" height="30" rx="8" stroke="#5f6b7d" stroke-opacity=".5" stroke-dasharray="3 3"/>
    <text x="308" y="79" class="sans" font-size="10" font-style="italic" fill="#5f6b7d">&#8856; deleted by guard</text>
  </g>
  <g class="wkept"><rect x="299" y="94" width="158" height="30" rx="8" fill="#111a22"/><text x="308" y="106" class="mono" font-size="8" fill="#25d366">Team Nexera</text><text x="308" y="118" class="sans" font-size="10" fill="#eef2f8"><tspan fill="#38bdf8" text-decoration="underline">nexera.in/events/hackfest</tspan>  <tspan fill="#25d366">&#10003;</tspan></text></g>
</g>
<g class="in">
  <rect x="28" y="28" width="191" height="24" rx="12" fill="#25d366" fill-opacity=".14" stroke="#25d366" stroke-opacity=".5"/>
  <circle cx="41" cy="40" r="3.5" fill="#25d366" class="pulse"/>
  <text x="51" y="44" class="mono" font-size="11" letter-spacing="1.5" fill="#25d366">WHATSAPP BOT · 24/7</text>
</g>
<g class="in" style="animation-delay:.15s">
  <text x="27" y="110" class="sans" font-size="30" font-weight="800" letter-spacing="-.5" fill="#eef2f8">WA Spam Guard</text>
  <text class="sans" font-size="14.5" fill="#9aa4b5"><tspan x="28" y="152">Clears spam links from NEXERA's WhatsApp groups</tspan><tspan x="28" y="174">24/7, running on a spare Android phone.</tspan></text>
  <rect x="28.0" y="218" width="72.4" height="24" rx="12" fill="#25d366" fill-opacity=".1" stroke="#25d366" stroke-opacity=".4"/><text x="39.0" y="234" class="mono" font-size="12" fill="#25d366">Node.js</text><rect x="108.4" y="218" width="72.4" height="24" rx="12" fill="#25d366" fill-opacity=".1" stroke="#25d366" stroke-opacity=".4"/><text x="119.4" y="234" class="mono" font-size="12" fill="#25d366">Baileys</text><rect x="188.8" y="218" width="65.2" height="24" rx="12" fill="#25d366" fill-opacity=".1" stroke="#25d366" stroke-opacity=".4"/><text x="199.8" y="234" class="mono" font-size="12" fill="#25d366">Termux</text>
  
</g>
</g>
</svg>
</svg>
