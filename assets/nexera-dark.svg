<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="312" viewBox="0 0 1000 312" fill="none" role="img">
<style>
  .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
  .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
  .c { animation: rise .8s cubic-bezier(.2,.8,.2,1) both; }
  .f { animation: fade .9s ease-out both; }
  @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<defs>
  <clipPath id="card"><rect width="1000" height="312" rx="12"/></clipPath>
  
</defs>
<rect x="0.5" y="0.5" width="999" height="311" rx="11.5" fill="#0d1117" stroke="#30363d"/>
<g clip-path="url(#card)">

