<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" fill="none" role="img">
<style>
  .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
  .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
  .in { animation: fadein .8s cubic-bezier(.2,.8,.2,1) both; }
  .rise { animation: rise .9s cubic-bezier(.2,.8,.2,1) both; }
  .blink { animation: blink 1s steps(1) infinite; }
  .pulse { animation: pulse 2s ease-in-out infinite; }
  .ping { animation: ping 2.2s cubic-bezier(0,0,.2,1) infinite; transform-box: fill-box; transform-origin: center; }
  .bob { animation: bob 6s ease-in-out infinite; }
  .twinkle { animation: twinkle 3s ease-in-out infinite; }
  @keyframes fadein { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @keyframes rise { from { opacity: 0; transform: translateY(26px); } to { opacity: 1; transform: none; } }
  @keyframes blink { 50% { opacity: 0; } }
  @keyframes pulse { 0%, 100% { opacity: .45; } 50% { opacity: 1; } }
  @keyframes ping { 0% { transform: scale(1); opacity: .7; } 80%, 100% { transform: scale(3); opacity: 0; } }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
  @keyframes twinkle { 0%, 100% { opacity: .15; } 50% { opacity: .9; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<defs>
  <linearGradient id="cardbg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b1118"/><stop offset="1" stop-color="#04070b"/></linearGradient>
  <linearGradient id="cometg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2dd4bf"/><stop offset="1" stop-color="#39d353"/></linearGradient>
  <clipPath id="clip"><rect width="1000" height="400" rx="16"/></clipPath>
  
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="5" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
  
  <linearGradient id="word" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
    <stop offset="0" stop-color="#ffffff"/><stop offset=".5" stop-color="#39d353"/><stop offset="1" stop-color="#ffffff"/>
    <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0" dur="5s" repeatCount="indefinite"/>
  </linearGradient>
  <radialGradient id="nglow" cx="260" cy="190" r="320" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#39d353" stop-opacity=".13"/><stop offset="1" stop-color="#39d353" stop-opacity="0"/></radialGradient>
</defs>
<rect x="0.5" y="0.5" width="999" height="399" rx="16" fill="url(#cardbg)" stroke="#1b2a26"/><path d="M14 32 V14 H32" stroke="#39d353" stroke-opacity=".55" stroke-width="1.5"/><path d="M986 32 V14 H968" stroke="#39d353" stroke-opacity=".55" stroke-width="1.5"/><path d="M14 368 V386 H32" stroke="#39d353" stroke-opacity=".55" stroke-width="1.5"/><path d="M986 368 V386 H968" stroke="#39d353" stroke-opacity=".55" stroke-width="1.5"/><rect x="1" y="1" width="998" height="398" rx="16" pathLength="1000" fill="none" stroke="url(#cometg)" stroke-width="2" stroke-linecap="round" stroke-dasharray="140 860" filter="url(#glow)"><animate attributeName="stroke-dashoffset" from="1000" to="0" dur="7s" repeatCount="indefinite"/></rect><g class="in"><text x="40" y="52" class="mono" font-size="13" letter-spacing="3" fill="#5b6875"><tspan fill="#39d353">[ 02 ]</tspan>  NOW BUILDING</text></g>
<g clip-path="url(#clip)">

<rect width="1000" height="400" fill="url(#nglow)"/>
<g class="in" style="animation-delay:.1s">
  <rect x="48" y="90" width="170" height="30" rx="15" fill="#39d353" fill-opacity=".1" stroke="#39d353" stroke-opacity=".45"/>
  <circle cx="66" cy="105" r="4" fill="#39d353"/><circle cx="66" cy="105" r="4" fill="#39d353" class="ping"/>
  <text x="80" y="110" class="mono" font-size="12.5" letter-spacing="2" fill="#39d353">FOUNDER &amp; CEO</text>
</g>
<g class="in" style="animation-delay:.2s">
  <text x="44" y="200" class="sans" font-size="86" font-weight="900" letter-spacing="14" fill="#39d353" opacity=".45" filter="url(#soft)">NEXERA</text>
  <text x="44" y="200" class="sans" font-size="86" font-weight="900" letter-spacing="14" fill="url(#word)">NEXERA</text>
  <text x="48" y="242" class="sans" font-size="24" font-weight="300" fill="#e6edf3">Shaping futures.</text>
  <text class="sans" font-size="16" fill="#93a1ad">
    <tspan x="48" y="284">A student-driven ecosystem that brings education,</tspan>
    <tspan x="48" y="308">events and community together. Home to IPUNEX.</tspan>
  </text>
  <rect x="48" y="332" width="206" height="36" rx="18" fill="#39d353"/>
  <text x="151" y="355" text-anchor="middle" class="mono" font-size="14" font-weight="700" fill="#04140a">nexeraofficial.in &#8599;</text>
</g>

<g class="in" style="animation-delay:0.35s">
  <rect x="548" y="92" width="404" height="80" rx="12" fill="#0a1510" stroke="#1f6f33" stroke-opacity=".8"/>
  <rect x="548" y="110" width="3" height="44" rx="1.5" fill="#39d353" filter="url(#glow)"/>
  <rect x="570" y="110" width="44" height="44" rx="10" fill="#39d353" fill-opacity=".1" stroke="#39d353" stroke-opacity=".35"/>
  <g transform="translate(580 120)"><path d="M3 5.5c3-1.6 6.3-1.6 9 .5 2.7-2.1 6-2.1 9-.5V19c-3-1.4-6.3-1.4-9 .6-2.7-2-6-2-9-.6Z M12 6v13.6" stroke="#39d353" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g>
  <text x="632" y="128" class="sans" font-size="19" font-weight="700" fill="#e6edf3">Education</text>
  <text x="632" y="151" class="sans" font-size="14.5" fill="#93a1ad">IPUNEX: structured learning and practice</text>
  <text x="930" y="128" text-anchor="end" class="mono" font-size="12" fill="#39d353" opacity=".7">01</text>
</g>
<g class="in" style="animation-delay:0.47s">
  <rect x="548" y="188" width="404" height="80" rx="12" fill="#0a1510" stroke="#1f6f33" stroke-opacity=".8"/>
  <rect x="548" y="206" width="3" height="44" rx="1.5" fill="#39d353" filter="url(#glow)"/>
  <rect x="570" y="206" width="44" height="44" rx="10" fill="#39d353" fill-opacity=".1" stroke="#39d353" stroke-opacity=".35"/>
  <g transform="translate(580 216)"><path d="M13.5 2 4.5 13.5H11L10 22l9.5-12H13Z" stroke="#39d353" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g>
  <text x="632" y="224" class="sans" font-size="19" font-weight="700" fill="#e6edf3">Events</text>
  <text x="632" y="247" class="sans" font-size="14.5" fill="#93a1ad">Tech events that bring builders together</text>
  <text x="930" y="224" text-anchor="end" class="mono" font-size="12" fill="#39d353" opacity=".7">02</text>
</g>
<g class="in" style="animation-delay:0.59s">
  <rect x="548" y="284" width="404" height="80" rx="12" fill="#0a1510" stroke="#1f6f33" stroke-opacity=".8"/>
  <rect x="548" y="302" width="3" height="44" rx="1.5" fill="#39d353" filter="url(#glow)"/>
  <rect x="570" y="302" width="44" height="44" rx="10" fill="#39d353" fill-opacity=".1" stroke="#39d353" stroke-opacity=".35"/>
  <g transform="translate(580 312)"><path d="M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8Z M2 21c0-4 3-6.5 7-6.5s7 2.5 7 6.5 M17 3.5a3.5 3.5 0 0 1 0 7 M19 14.5c2 .6 3.5 2.6 3.5 6" stroke="#39d353" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g>
  <text x="632" y="320" class="sans" font-size="19" font-weight="700" fill="#e6edf3">Community</text>
  <text x="632" y="343" class="sans" font-size="14.5" fill="#93a1ad">Students learning and growing together</text>
  <text x="930" y="320" text-anchor="end" class="mono" font-size="12" fill="#39d353" opacity=".7">03</text>
</g>
</g>
</svg>
