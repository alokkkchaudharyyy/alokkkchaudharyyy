<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="360" viewBox="0 0 1000 360" fill="none" role="img">
<style>
  .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
  .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
  .in { animation: fadein .8s cubic-bezier(.2,.8,.2,1) both; }
  .rise { animation: rise .9s cubic-bezier(.2,.8,.2,1) both; }
  .blink { animation: blink 1s steps(1) infinite; }
  .pulse { animation: pulse 2.4s ease-in-out infinite; }
  .ping { animation: ping 2.2s cubic-bezier(0,0,.2,1) infinite; transform-box: fill-box; transform-origin: center; }
  .bob { animation: bob 6s ease-in-out infinite; }
  .twinkle { animation: twinkle 3s ease-in-out infinite; }
  .drift { animation: drift linear infinite; }
  @keyframes fadein { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @keyframes rise { from { opacity: 0; transform: translateY(26px); } to { opacity: 1; transform: none; } }
  @keyframes blink { 50% { opacity: 0; } }
  @keyframes pulse { 0%, 100% { opacity: .4; } 50% { opacity: 1; } }
  @keyframes ping { 0% { transform: scale(1); opacity: .7; } 80%, 100% { transform: scale(3); opacity: 0; } }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
  @keyframes twinkle { 0%, 100% { opacity: .15; } 50% { opacity: .9; } }
  @keyframes drift { from { transform: translateX(0); } to { transform: translateX(var(--d, -200px)); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<defs>
  <linearGradient id="cardbg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0c0f17"/><stop offset="1" stop-color="#05060a"/></linearGradient>
  <linearGradient id="cometg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6366f1"/><stop offset="1" stop-color="#0be5ba"/></linearGradient>
  <clipPath id="clip"><rect width="1000" height="360" rx="16"/></clipPath>
  
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="5" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
  
  <clipPath id="orb"><circle cx="88" cy="118" r="40"/></clipPath>
  <radialGradient id="nglow" cx="200" cy="120" r="380" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#6366f1" stop-opacity=".22"/><stop offset="1" stop-color="#6366f1" stop-opacity="0"/></radialGradient>
  <linearGradient id="word" x1="0" x2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#c7c8ff"/></linearGradient>
</defs>
<rect x="0.5" y="0.5" width="999" height="359" rx="16" fill="url(#cardbg)" stroke="#1f2433"/><path d="M14 32 V14 H32" stroke="#6366f1" stroke-opacity=".6" stroke-width="1.5"/><path d="M986 32 V14 H968" stroke="#6366f1" stroke-opacity=".6" stroke-width="1.5"/><path d="M14 328 V346 H32" stroke="#6366f1" stroke-opacity=".6" stroke-width="1.5"/><path d="M986 328 V346 H968" stroke="#6366f1" stroke-opacity=".6" stroke-width="1.5"/><rect x="1" y="1" width="998" height="358" rx="16" pathLength="1000" fill="none" stroke="url(#cometg)" stroke-width="2" stroke-linecap="round" stroke-dasharray="140 860" filter="url(#glow)"><animate attributeName="stroke-dashoffset" from="1000" to="0" dur="7s" repeatCount="indefinite"/></rect><g class="in"><text x="40" y="52" class="mono" font-size="13" letter-spacing="3" fill="#5f6b7d"><tspan fill="#6366f1">[ 03 ]</tspan>  COMPANY</text></g>
<g clip-path="url(#clip)">

<rect width="1000" height="360" fill="url(#nglow)"/>
<g class="in" style="animation-delay:.1s">
  <circle cx="88" cy="118" r="52" fill="#6366f1" opacity=".35" filter="url(#soft)" class="pulse"/>
  <image x="48" y="78" width="80" height="80" clip-path="url(#orb)" href="data:image/jpeg;base64," xlink:href="data:image/jpeg;base64,"/>
  <circle cx="88" cy="118" r="40" stroke="#0be5ba" stroke-opacity=".6" stroke-width="1.5"/>
  <text x="152" y="114" class="sans" font-size="44" font-weight="900" letter-spacing="8" fill="url(#word)">NEXERA</text>
  <text x="154" y="142" class="mono" font-size="12.5" letter-spacing="2" fill="#0be5ba">MY STARTUP · FOUNDER &amp; CEO</text>
  <text x="48" y="204" class="sans" font-size="22" font-weight="300" fill="#eef2f8">Shaping futures.</text>
  <text class="sans" font-size="15.5" fill="#9aa4b5">
    <tspan x="48" y="240">A student-driven ecosystem that brings education,</tspan>
    <tspan x="48" y="263">events and community together for college students.</tspan>
  </text>
  <rect x="48" y="290" width="206" height="36" rx="18" fill="#6366f1"/>
  <text x="151" y="313" text-anchor="middle" class="mono" font-size="14" font-weight="700" fill="#fff">nexeraofficial.in &#8599;</text>
</g>

<g class="in" style="animation-delay:0.35s">
  <rect x="548" y="80" width="404" height="72" rx="12" fill="#0d0e1f" stroke="#6366f1" stroke-opacity=".45"/>
  <rect x="568" y="94" width="44" height="44" rx="10" fill="#0be5ba" fill-opacity=".1" stroke="#0be5ba" stroke-opacity=".4"/>
  <g transform="translate(578 104)"><path d="M3 5.5c3-1.6 6.3-1.6 9 .5 2.7-2.1 6-2.1 9-.5V19c-3-1.4-6.3-1.4-9 .6-2.7-2-6-2-9-.6Z M12 6v13.6" stroke="#0be5ba" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g>
  <text x="630" y="112" class="sans" font-size="18" font-weight="700" fill="#eef2f8">Education</text>
  <text x="630" y="134" class="sans" font-size="14" fill="#9aa4b5">IPUNEX notes, PYQs, courses and SkillX</text>
</g>
<g class="in" style="animation-delay:0.47s">
  <rect x="548" y="166" width="404" height="72" rx="12" fill="#0d0e1f" stroke="#6366f1" stroke-opacity=".45"/>
  <rect x="568" y="180" width="44" height="44" rx="10" fill="#0be5ba" fill-opacity=".1" stroke="#0be5ba" stroke-opacity=".4"/>
  <g transform="translate(578 190)"><path d="M13.5 2 4.5 13.5H11L10 22l9.5-12H13Z" stroke="#0be5ba" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g>
  <text x="630" y="198" class="sans" font-size="18" font-weight="700" fill="#eef2f8">Events</text>
  <text x="630" y="220" class="sans" font-size="14" fill="#9aa4b5">Tech events that bring builders together</text>
</g>
<g class="in" style="animation-delay:0.59s">
  <rect x="548" y="252" width="404" height="72" rx="12" fill="#0d0e1f" stroke="#6366f1" stroke-opacity=".45"/>
  <rect x="568" y="266" width="44" height="44" rx="10" fill="#0be5ba" fill-opacity=".1" stroke="#0be5ba" stroke-opacity=".4"/>
  <g transform="translate(578 276)"><path d="M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8Z M2 21c0-4 3-6.5 7-6.5s7 2.5 7 6.5 M17 3.5a3.5 3.5 0 0 1 0 7 M19 14.5c2 .6 3.5 2.6 3.5 6" stroke="#0be5ba" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g>
  <text x="630" y="284" class="sans" font-size="18" font-weight="700" fill="#eef2f8">Community</text>
  <text x="630" y="306" class="sans" font-size="14" fill="#9aa4b5">Students learning and growing together</text>
</g>
</g>
</svg>
