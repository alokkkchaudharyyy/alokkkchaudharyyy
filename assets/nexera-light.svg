<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="312" viewBox="0 0 1000 312" fill="none" role="img">
<style>
  .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
  .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
  .c { animation: rise .8s cubic-bezier(.2,.8,.2,1) both; }
  .f { animation: fade .9s ease-out both; }
  @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<defs>
  <clipPath id="card"><rect width="1000" height="312" rx="12"/></clipPath>
  
</defs>
<rect x="0.5" y="0.5" width="999" height="311" rx="11.5" fill="#ffffff" stroke="#d1d9e0"/>
<g clip-path="url(#card)">

<g class="f">
  <circle cx="52" cy="71" r="4" fill="#1a7f37"/>
  <text x="66" y="76" class="mono" font-size="13" letter-spacing="2" fill="#818b98">FOUNDER &amp; CEO</text>
  <text x="45" y="136" class="sans" font-size="56" font-weight="800" letter-spacing="9" fill="#1f2328">NEXERA</text>
  <text x="48" y="172" class="sans" font-size="20" fill="#59636e">Shaping futures.</text>
  <text class="sans" font-size="16" fill="#818b98">
