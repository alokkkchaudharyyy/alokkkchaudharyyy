    <path d="M36 64 L36 60.0 L44 60.4 L52 61.8 L60 64.0 L68 66.1 L76 67.6 L84 68.0 L92 67.0 L100 65.1 L108 62.9 L116 61.0 L124 60.0 L132 60.4 L140 61.8 L148 64.0 L156 66.2 L164 67.6 L172 68.0 L180 67.0 L188 65.1 L196 62.9 L204 61.0 L212 60.0 L220 60.4 L228 61.8 L236 64.0 L244 66.2 L252 67.6 L260 68.0 L268 67.0 L276 65.1 L284 62.9 L292 61.0 L300 60.0 L308 60.4 L316 61.8 L324 64.0 L332 66.2 L340 67.6 L348 68.0 L356 67.0 L364 65.1 L372 62.9 L380 61.0 L388 60.0 L396 60.4 L404 61.9 L412 64.0 L420 66.2 L428 67.6 L436 68.0 L444 67.0 L452 65.1 L460 62.8 L468 61.0 L476 60.0 L484 60.4 L492 61.9 L500 64.0 L508 66.2 L516 67.7 L524 68.0 L532 67.0 L540 65.1 L548 62.8 L556 61.0 L564 60.0 L572 60.4 L580 61.9 L588 64.0 L596 66.2 L604 67.7 L612 68.0 L620 67.0 L628 65.1 L632 44 L36 44 Z" fill="#0c0f17"><animateTransform attributeName="transform" type="translate" values="0 0;-88 0" dur="3s" repeatCount="indefinite"/></path>
  </g>
  <rect x="236" y="54" width="196" height="114" rx="8" stroke="#38bdf8" stroke-opacity=".4"/>
  <text x="440" y="72" class="mono" font-size="9.5" fill="#5f6b7d">0 m</text>
  <text x="440" y="168" class="mono" font-size="9.5" fill="#5f6b7d">1000 m</text>
  <g class="bob" style="animation-duration:5s">
    <rect x="328" y="24" width="28" height="12" rx="2" fill="#9aa4b5"/>
    <rect x="306" y="27" width="20" height="6" fill="#38bdf8"/><rect x="358" y="27" width="20" height="6" fill="#38bdf8"/>
    <path d="M342 38 L316 62 M342 38 L368 62" stroke="#38bdf8" stroke-opacity=".5" stroke-dasharray="2 3" class="pulse"/>
  </g>
</g>
<g class="in">
