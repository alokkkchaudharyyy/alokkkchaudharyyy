<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="490" height="340" viewBox="0 0 490 340" fill="none" role="img">
<style>
  .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
  .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
  .in { animation: fadein .8s cubic-bezier(.2,.8,.2,1) both; }
  .rise { animation: rise .9s cubic-bezier(.2,.8,.2,1) both; }
  .blink { animation: blink 1s steps(1) infinite; }
  .pulse { animation: pulse 2.4s ease-in-out infinite; }
  .ping { animation: ping 2.2s cubic-bezier(0,0,.2,1) infinite; transform-box: fill-box; transform-origin: center; }
  .bob { animation: bob 6s ease-in-out infinite; }
  .twinkle { animation: twinkle 3s ease-in-out infinite; }
  .drift { animation: drift linear infinite; }
  @keyframes fadein { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @keyframes rise { from { opacity: 0; transform: translateY(26px); } to { opacity: 1; transform: none; } }
  @keyframes blink { 50% { opacity: 0; } }
  @keyframes pulse { 0%, 100% { opacity: .4; } 50% { opacity: 1; } }
  @keyframes ping { 0% { transform: scale(1); opacity: .7; } 80%, 100% { transform: scale(3); opacity: 0; } }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
  @keyframes twinkle { 0%, 100% { opacity: .15; } 50% { opacity: .9; } }
  @keyframes drift { from { transform: translateX(0); } to { transform: translateX(var(--d, -200px)); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<defs>
  <linearGradient id="cardbg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0c0f17"/><stop offset="1" stop-color="#05060a"/></linearGradient>
  <linearGradient id="cometg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#227195"/></linearGradient>
  <clipPath id="clip"><rect width="490" height="340" rx="16"/></clipPath>
  
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="5" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
  <radialGradient id="tglow" cx="392" cy="40" r="343" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#38bdf8" stop-opacity=".16"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/></radialGradient>
</defs>
<rect x="0.5" y="0.5" width="489" height="339" rx="16" fill="url(#cardbg)" stroke="#1f2433"/><path d="M14 32 V14 H32" stroke="#38bdf8" stroke-opacity=".6" stroke-width="1.5"/><path d="M476 32 V14 H458" stroke="#38bdf8" stroke-opacity=".6" stroke-width="1.5"/><path d="M14 308 V326 H32" stroke="#38bdf8" stroke-opacity=".6" stroke-width="1.5"/><path d="M476 308 V326 H458" stroke="#38bdf8" stroke-opacity=".6" stroke-width="1.5"/><rect x="1" y="1" width="488" height="338" rx="16" pathLength="1000" fill="none" stroke="url(#cometg)" stroke-width="2" stroke-linecap="round" stroke-dasharray="140 860" filter="url(#glow)"><animate attributeName="stroke-dashoffset" from="1000" to="0" dur="7s" repeatCount="indefinite"/></rect>
<g clip-path="url(#clip)">

<rect width="490" height="340" fill="url(#tglow)"/>
<g transform="translate(56 12) scale(.88)">
<g class="in" style="animation-delay:.2s">
  <clipPath id="sea"><rect x="236" y="50" width="196" height="76" rx="8"/></clipPath>
