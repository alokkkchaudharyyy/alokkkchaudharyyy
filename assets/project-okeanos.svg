    <path d="M36 60 L36 56.0 L44 56.4 L52 57.8 L60 60.0 L68 62.1 L76 63.6 L84 64.0 L92 63.0 L100 61.1 L108 58.9 L116 57.0 L124 56.0 L132 56.4 L140 57.8 L148 60.0 L156 62.2 L164 63.6 L172 64.0 L180 63.0 L188 61.1 L196 58.9 L204 57.0 L212 56.0 L220 56.4 L228 57.8 L236 60.0 L244 62.2 L252 63.6 L260 64.0 L268 63.0 L276 61.1 L284 58.9 L292 57.0 L300 56.0 L308 56.4 L316 57.8 L324 60.0 L332 62.2 L340 63.6 L348 64.0 L356 63.0 L364 61.1 L372 58.9 L380 57.0 L388 56.0 L396 56.4 L404 57.9 L412 60.0 L420 62.2 L428 63.6 L436 64.0 L444 63.0 L452 61.1 L460 58.8 L468 57.0 L476 56.0 L484 56.4 L492 57.9 L500 60.0 L508 62.2 L516 63.7 L524 64.0 L532 63.0 L540 61.1 L548 58.8 L556 57.0 L564 56.0 L572 56.4 L580 57.9 L588 60.0 L596 62.2 L604 63.7 L612 64.0 L620 63.0 L628 61.1 L632 40 L36 40 Z" fill="#0c0f17"><animateTransform attributeName="transform" type="translate" values="0 0;-88 0" dur="3s" repeatCount="indefinite"/></path>
  </g>
  <rect x="236" y="50" width="196" height="76" rx="8" stroke="#38bdf8" stroke-opacity=".4"/>
  <text x="440" y="68" class="mono" font-size="9.5" fill="#5f6b7d">0 m</text>
  <text x="440" y="126" class="mono" font-size="9.5" fill="#5f6b7d">1000 m</text>
  <g class="bob" style="animation-duration:5s">
    <rect x="328" y="24" width="28" height="12" rx="2" fill="#9aa4b5"/>
    <rect x="306" y="27" width="20" height="6" fill="#38bdf8"/><rect x="358" y="27" width="20" height="6" fill="#38bdf8"/>
    <path d="M342 38 L316 58 M342 38 L368 58" stroke="#38bdf8" stroke-opacity=".5" stroke-dasharray="2 3" class="pulse"/>
  </g>
</g></g>
<g class="in">
  <rect x="34" y="34" width="158" height="24" rx="12" fill="#38bdf8" fill-opacity=".14" stroke="#38bdf8" stroke-opacity=".5"/>
  <circle cx="47" cy="46" r="3.5" fill="#38bdf8" class="pulse"/>
  <text x="57" y="50" class="mono" font-size="11" letter-spacing="1.5" fill="#38bdf8">SIH 2026 · TEAM</text>
</g>
<g class="in" style="animation-delay:.15s">
  <text x="33" y="124" class="sans" font-size="30" font-weight="800" letter-spacing="-.5" fill="#eef2f8">Okeanos</text>
  <text class="sans" font-size="14.5" fill="#9aa4b5"><tspan x="34" y="176">Rebuilds the North Indian Ocean's temperature</tspan><tspan x="34" y="200">down to 1000 m from satellite surface data alone.</tspan></text>
  <rect x="34.0" y="282" width="65.2" height="24" rx="12" fill="#38bdf8" fill-opacity=".1" stroke="#38bdf8" stroke-opacity=".4"/><text x="45.0" y="298" class="mono" font-size="12" fill="#38bdf8">Python</text><rect x="107.2" y="282" width="72.4" height="24" rx="12" fill="#38bdf8" fill-opacity=".1" stroke="#38bdf8" stroke-opacity=".4"/><text x="118.2" y="298" class="mono" font-size="12" fill="#38bdf8">PyTorch</text><rect x="187.6" y="282" width="72.4" height="24" rx="12" fill="#38bdf8" fill-opacity=".1" stroke="#38bdf8" stroke-opacity=".4"/><text x="198.6" y="298" class="mono" font-size="12" fill="#38bdf8">XGBoost</text>
  
</g>
</g>
</svg>
