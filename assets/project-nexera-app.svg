<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="490" height="330" viewBox="0 0 490 330" fill="none" role="img">
<style>
  .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
  .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
  .in { animation: fadein .8s cubic-bezier(.2,.8,.2,1) both; }
  .rise { animation: rise .9s cubic-bezier(.2,.8,.2,1) both; }
  .blink { animation: blink 1s steps(1) infinite; }
  .pulse { animation: pulse 2.4s ease-in-out infinite; }
  .ping { animation: ping 2.2s cubic-bezier(0,0,.2,1) infinite; transform-box: fill-box; transform-origin: center; }
  .bob { animation: bob 6s ease-in-out infinite; }
  .twinkle { animation: twinkle 3s ease-in-out infinite; }
  .drift { animation: drift linear infinite; }
  @keyframes fadein { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @keyframes rise { from { opacity: 0; transform: translateY(26px); } to { opacity: 1; transform: none; } }
  @keyframes blink { 50% { opacity: 0; } }
  @keyframes pulse { 0%, 100% { opacity: .4; } 50% { opacity: 1; } }
  @keyframes ping { 0% { transform: scale(1); opacity: .7; } 80%, 100% { transform: scale(3); opacity: 0; } }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
  @keyframes twinkle { 0%, 100% { opacity: .15; } 50% { opacity: .9; } }
  @keyframes drift { from { transform: translateX(0); } to { transform: translateX(var(--d, -200px)); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<defs>
  <linearGradient id="cardbg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0c0f17"/><stop offset="1" stop-color="#05060a"/></linearGradient>
  <linearGradient id="cometg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fbbf24"/><stop offset="1" stop-color="#977316"/></linearGradient>
  <clipPath id="clip"><rect width="490" height="330" rx="16"/></clipPath>
  
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="5" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
  <radialGradient id="tglow" cx="392" cy="40" r="343" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#fbbf24" stop-opacity=".16"/><stop offset="1" stop-color="#fbbf24" stop-opacity="0"/></radialGradient>
</defs>
<rect x="0.5" y="0.5" width="489" height="329" rx="16" fill="url(#cardbg)" stroke="#1f2433"/><path d="M14 32 V14 H32" stroke="#fbbf24" stroke-opacity=".6" stroke-width="1.5"/><path d="M476 32 V14 H458" stroke="#fbbf24" stroke-opacity=".6" stroke-width="1.5"/><path d="M14 298 V316 H32" stroke="#fbbf24" stroke-opacity=".6" stroke-width="1.5"/><path d="M476 298 V316 H458" stroke="#fbbf24" stroke-opacity=".6" stroke-width="1.5"/><rect x="1" y="1" width="488" height="328" rx="16" pathLength="1000" fill="none" stroke="url(#cometg)" stroke-width="2" stroke-linecap="round" stroke-dasharray="140 860" filter="url(#glow)"><animate attributeName="stroke-dashoffset" from="1000" to="0" dur="7s" repeatCount="indefinite"/></rect>
<g clip-path="url(#clip)">

<rect width="490" height="330" fill="url(#tglow)"/>

<g class="bob" style="animation-duration:7s">
  <rect x="324" y="26" width="92" height="150" rx="16" fill="#0d0a04" stroke="#fbbf24" stroke-opacity=".7" stroke-width="1.5"/>
  <rect x="356" y="32" width="28" height="5" rx="2.5" fill="#fbbf24" fill-opacity=".5"/>
  <clipPath id="screen"><rect x="332" y="44" width="76" height="124" rx="8"/></clipPath>
  <g clip-path="url(#screen)">
    <g><rect x="338" y="52" width="64" height="22" rx="5" fill="#fbbf24" fill-opacity=".85"/><rect x="344" y="58" width="24" height="4" rx="2" fill="#000" fill-opacity=".45"/><rect x="344" y="66" width="18" height="3" rx="1.5" fill="#000" fill-opacity=".3"/><rect x="338" y="82" width="64" height="22" rx="5" fill="#a78bfa" fill-opacity=".85"/><rect x="344" y="88" width="32" height="4" rx="2" fill="#000" fill-opacity=".45"/><rect x="344" y="96" width="18" height="3" rx="1.5" fill="#000" fill-opacity=".3"/><rect x="338" y="112" width="64" height="22" rx="5" fill="#fb923c" fill-opacity=".85"/><rect x="344" y="118" width="40" height="4" rx="2" fill="#000" fill-opacity=".45"/><rect x="344" y="126" width="18" height="3" rx="1.5" fill="#000" fill-opacity=".3"/><rect x="338" y="142" width="64" height="22" rx="5" fill="#22d3ee" fill-opacity=".85"/><rect x="344" y="148" width="24" height="4" rx="2" fill="#000" fill-opacity=".45"/><rect x="344" y="156" width="18" height="3" rx="1.5" fill="#000" fill-opacity=".3"/><rect x="338" y="172" width="64" height="22" rx="5" fill="#fbbf24" fill-opacity=".85"/><rect x="344" y="178" width="32" height="4" rx="2" fill="#000" fill-opacity=".45"/><rect x="344" y="186" width="18" height="3" rx="1.5" fill="#000" fill-opacity=".3"/><rect x="338" y="202" width="64" height="22" rx="5" fill="#f472b6" fill-opacity=".85"/><rect x="344" y="208" width="40" height="4" rx="2" fill="#000" fill-opacity=".45"/><rect x="344" y="216" width="18" height="3" rx="1.5" fill="#000" fill-opacity=".3"/><rect x="338" y="232" width="64" height="22" rx="5" fill="#a78bfa" fill-opacity=".85"/><rect x="344" y="238" width="24" height="4" rx="2" fill="#000" fill-opacity=".45"/><rect x="344" y="246" width="18" height="3" rx="1.5" fill="#000" fill-opacity=".3"/><rect x="338" y="262" width="64" height="22" rx="5" fill="#fb923c" fill-opacity=".85"/><rect x="344" y="268" width="32" height="4" rx="2" fill="#000" fill-opacity=".45"/><rect x="344" y="276" width="18" height="3" rx="1.5" fill="#000" fill-opacity=".3"/><animateTransform attributeName="transform" type="translate" values="0 0;0 -120" dur="6s" repeatCount="indefinite"/></g>
  </g>
</g>
<ellipse cx="370" cy="196" rx="60" ry="8" fill="#fbbf24" opacity=".2" filter="url(#soft)"/>
<g class="in">
  <rect x="28" y="28" width="175" height="24" rx="12" fill="#fbbf24" fill-opacity=".14" stroke="#fbbf24" stroke-opacity=".5"/>
  <circle cx="41" cy="40" r="3.5" fill="#fbbf24" class="pulse"/>
  <text x="51" y="44" class="mono" font-size="11" letter-spacing="1.5" fill="#fbbf24">FLUTTER · ANDROID</text>
</g>
<g class="in" style="animation-delay:.15s">
  <text x="27" y="112" class="sans" font-size="30" font-weight="800" letter-spacing="-.5" fill="#eef2f8">Nexera App</text>
  <rect x="28" y="126" width="36" height="3" rx="1.5" fill="#fbbf24"/>
  <text x="28" y="154" class="mono" font-size="12" letter-spacing="1" fill="#5f6b7d">Google Play · APK</text>
  <text class="sans" font-size="14.5" fill="#9aa4b5"><tspan x="28" y="206">The NEXERA mobile app: IPUNEX notes and PYQs,</tspan><tspan x="28" y="228">video courses, SkillX DSA practice and doubts.</tspan></text>
  <rect x="28.0" y="268" width="72.4" height="24" rx="12" fill="#fbbf24" fill-opacity=".1" stroke="#fbbf24" stroke-opacity=".4"/><text x="39.0" y="284" class="mono" font-size="12" fill="#fbbf24">Flutter</text><rect x="108.4" y="268" width="50.8" height="24" rx="12" fill="#fbbf24" fill-opacity=".1" stroke="#fbbf24" stroke-opacity=".4"/><text x="119.4" y="284" class="mono" font-size="12" fill="#fbbf24">Dart</text><rect x="167.2" y="268" width="72.4" height="24" rx="12" fill="#fbbf24" fill-opacity=".1" stroke="#fbbf24" stroke-opacity=".4"/><text x="178.2" y="284" class="mono" font-size="12" fill="#fbbf24">Android</text>
  
  <text x="462" y="44" text-anchor="end" class="mono" font-size="16" fill="#fbbf24">&#8599;</text>
</g>
</g>
</svg>
