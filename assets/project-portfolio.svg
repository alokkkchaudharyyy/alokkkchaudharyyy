<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="320" viewBox="0 0 1000 320" fill="none" role="img">
<style>
  .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
  .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
  .in { animation: fadein .8s cubic-bezier(.2,.8,.2,1) both; }
  .rise { animation: rise .9s cubic-bezier(.2,.8,.2,1) both; }
  .blink { animation: blink 1s steps(1) infinite; }
  .pulse { animation: pulse 2.4s ease-in-out infinite; }
  .ping { animation: ping 2.2s cubic-bezier(0,0,.2,1) infinite; transform-box: fill-box; transform-origin: center; }
  .bob { animation: bob 6s ease-in-out infinite; }
  .twinkle { animation: twinkle 3s ease-in-out infinite; }
  .drift { animation: drift linear infinite; }
  @keyframes fadein { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @keyframes rise { from { opacity: 0; transform: translateY(26px); } to { opacity: 1; transform: none; } }
  @keyframes blink { 50% { opacity: 0; } }
  @keyframes pulse { 0%, 100% { opacity: .4; } 50% { opacity: 1; } }
  @keyframes ping { 0% { transform: scale(1); opacity: .7; } 80%, 100% { transform: scale(3); opacity: 0; } }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
  @keyframes twinkle { 0%, 100% { opacity: .15; } 50% { opacity: .9; } }
  @keyframes drift { from { transform: translateX(0); } to { transform: translateX(var(--d, -200px)); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<defs>
  <linearGradient id="cardbg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0c0f17"/><stop offset="1" stop-color="#05060a"/></linearGradient>
  <linearGradient id="cometg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fbbf24"/><stop offset="1" stop-color="#f472b6"/></linearGradient>
  <clipPath id="clip"><rect width="1000" height="320" rx="16"/></clipPath>
  
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="5" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
  
  <linearGradient id="dusk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b1035"/><stop offset=".6" stop-color="#6b2147"/><stop offset="1" stop-color="#c2410c"/></linearGradient>
  <linearGradient id="psun" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbbf24"/><stop offset="1" stop-color="#f472b6"/></linearGradient>
  <radialGradient id="tglow" cx="300" cy="60" r="600" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#fb923c" stop-opacity=".12"/><stop offset="1" stop-color="#fb923c" stop-opacity="0"/></radialGradient>
  <linearGradient id="ptitle" x1="0" x2="1"><stop offset="0" stop-color="#fbbf24"/><stop offset="1" stop-color="#f472b6"/></linearGradient>
</defs>
<rect x="0.5" y="0.5" width="999" height="319" rx="16" fill="url(#cardbg)" stroke="#1f2433"/><path d="M14 32 V14 H32" stroke="#fb923c" stroke-opacity=".6" stroke-width="1.5"/><path d="M986 32 V14 H968" stroke="#fb923c" stroke-opacity=".6" stroke-width="1.5"/><path d="M14 288 V306 H32" stroke="#fb923c" stroke-opacity=".6" stroke-width="1.5"/><path d="M986 288 V306 H968" stroke="#fb923c" stroke-opacity=".6" stroke-width="1.5"/><rect x="1" y="1" width="998" height="318" rx="16" pathLength="1000" fill="none" stroke="url(#cometg)" stroke-width="2" stroke-linecap="round" stroke-dasharray="140 860" filter="url(#glow)"><animate attributeName="stroke-dashoffset" from="1000" to="0" dur="7s" repeatCount="indefinite"/></rect>
<g clip-path="url(#clip)">

<rect width="1000" height="320" fill="url(#tglow)"/>

<g>
  <clipPath id="world"><rect x="520" y="24" width="452" height="272" rx="14"/></clipPath>
  <g clip-path="url(#world)">
    <rect x="520" y="24" width="452" height="272" fill="url(#dusk)"/>
    <circle cx="850" cy="144" r="40" fill="url(#psun)" opacity=".95"/>
    <circle cx="850" cy="144" r="60" fill="#fb923c" opacity=".25" filter="url(#soft)"/>
    <g class="drift" style="--d:-300px;animation-duration:26s;animation-delay:-0s"><ellipse cx="600" cy="84" rx="46" ry="9" fill="#fff" opacity=".12"/><ellipse cx="630" cy="78" rx="30" ry="8" fill="#fff" opacity=".1"/></g><g class="drift" style="--d:-360px;animation-duration:35s;animation-delay:-7s"><ellipse cx="750" cy="102" rx="40" ry="9" fill="#fff" opacity=".12"/><ellipse cx="780" cy="96" rx="26" ry="8" fill="#fff" opacity=".1"/></g><g class="drift" style="--d:-420px;animation-duration:44s;animation-delay:-14s"><ellipse cx="900" cy="120" rx="34" ry="9" fill="#fff" opacity=".12"/><ellipse cx="930" cy="114" rx="22" ry="8" fill="#fff" opacity=".1"/></g>
    <polygon points="520.0,214.0 580.0,144.0 630.0,174.0 690.0,94.0 750.0,164.0 820.0,119.0 880.0,174.0 972.0,134.0 972.0,296.0 520.0,296.0" fill="#3b1d4a"/><polygon points="520.0,234.0 600.0,184.0 670.0,214.0 740.0,154.0 810.0,209.0 890.0,174.0 972.0,214.0 972.0,296.0 520.0,296.0" fill="#2a1236"/><polygon points="520.0,264.0 620.0,229.0 710.0,259.0 800.0,224.0 900.0,256.0 972.0,239.0 972.0,296.0 520.0,296.0" fill="#170a20"/><polygon points="690.0,94.0 674.0,116.0 704.0,114.0" fill="#fde7f3" opacity=".85"/><polygon points="820.0,119.0 804.0,141.0 834.0,139.0" fill="#fde7f3" opacity=".85"/><polygon points="580.0,144.0 564.0,166.0 594.0,164.0" fill="#fde7f3" opacity=".85"/>
    <path d="M550 292 C660 260 730 286 820 260 S940 250 972 254" stroke="#fbbf24" stroke-opacity=".55" stroke-width="2" stroke-dasharray="6 6"/>
    <circle r="5" fill="#fbbf24" filter="url(#glow)"><animateMotion dur="7s" repeatCount="indefinite" path="M550 292 C660 260 730 286 820 260 S940 250 972 254" rotate="auto"/></circle>
  </g>
  <rect x="520" y="24" width="452" height="272" rx="14" stroke="#fb923c" stroke-opacity=".35"/>
</g>
<g class="in">
  <rect x="40" y="40" width="191" height="24" rx="12" fill="#fb923c" fill-opacity=".14" stroke="#fb923c" stroke-opacity=".5"/>
  <circle cx="53" cy="52" r="3.5" fill="#fb923c" class="pulse"/>
  <text x="63" y="56" class="mono" font-size="11" letter-spacing="1.5" fill="#fb923c">LIVE · 3D PORTFOLIO</text>
  <text x="38" y="138" class="sans" font-size="44" font-weight="800" letter-spacing="-1" fill="url(#ptitle)">World of Alok</text>
  <text class="sans" font-size="15.5" fill="#9aa4b5"><tspan x="40" y="184">My portfolio as an explorable 3D world, set in a</tspan><tspan x="40" y="206">Himalayan valley. Projects, lab, career and</tspan><tspan x="40" y="228">achievements, every part of it in 3D.</tspan></text>
  <rect x="40.0" y="262" width="79.6" height="24" rx="12" fill="#fb923c" fill-opacity=".1" stroke="#fb923c" stroke-opacity=".4"/><text x="51.0" y="278" class="mono" font-size="12" fill="#fb923c">Three.js</text><rect x="127.6" y="262" width="94.0" height="24" rx="12" fill="#fb923c" fill-opacity=".1" stroke="#fb923c" stroke-opacity=".4"/><text x="138.6" y="278" class="mono" font-size="12" fill="#fb923c">Next.js 16</text><rect x="229.6" y="262" width="58.0" height="24" rx="12" fill="#fb923c" fill-opacity=".1" stroke="#fb923c" stroke-opacity=".4"/><text x="240.6" y="278" class="mono" font-size="12" fill="#fb923c">WebGL</text>
  <rect x="306" y="258" width="176" height="32" rx="16" fill="#fb923c"/>
  <text x="394" y="279" text-anchor="middle" class="mono" font-size="13" font-weight="700" fill="#1a0800">Explore it &#8599;</text>
</g>
</g>
</svg>
