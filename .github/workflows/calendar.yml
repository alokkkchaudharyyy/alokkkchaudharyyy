name: Live profile

on:
  schedule:
    - cron: "30 18 * * *" # every day at 00:00 IST
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tools/**
      - .github/workflows/calendar.yml

permissions:
  contents: write

concurrency:
  group: live-profile
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Terminal, contribution city and live project stats
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/profile.py live ${{ github.repository_owner }}

      - name: Commit snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            metrics/snake-dark.svg?palette=github-dark&color_snake=#fbbf24&color_dots=#161b22,#155e75,#0891b2,#22d3ee,#f472b6
            metrics/snake-light.svg?palette=github&color_snake=#db2777&color_dots=#ebedf0,#a5f3fc,#22d3ee,#0891b2,#db2777

      - name: Commit if changed
        run: |
          git add metrics
          if git diff --cached --quiet; then
            echo "Nothing changed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh live profile"
          git push
